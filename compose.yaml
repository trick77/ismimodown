# Production stack: one mimostats service behind an external Traefik reverse
# proxy that terminates TLS. Requires an external "traefik" network
# (`docker network create traefik`) shared with your Traefik instance.
#
#   cp .env.example .env    # fill in BACKEND_MIMO_API_KEY
#   docker compose up -d
#
services:
  mimostats:
    image: ghcr.io/trick77/mimostats:latest
    restart: unless-stopped

    # Non-root, no capabilities, no writable rootfs. The process opens TCP
    # sockets, talks HTTPS and writes one SQLite file — it needs nothing else,
    # so nothing else is granted.
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # SQLite needs a writable TMPDIR for its temp store even in WAL mode, and
      # the rootfs is read-only. Small on purpose: nothing large belongs here.
      - /tmp:size=64m

    environment:
      TMPDIR: /tmp
      BACKEND_ADDR: ":8080"
      BACKEND_LOG_LEVEL: "${BACKEND_LOG_LEVEL:-info}"
      # The token-plan host the tp- key is issued against. Compose reads .env
      # for ${} interpolation only, so anything not listed here never reaches
      # the container.
      BACKEND_MIMO_BASE_URL: "${BACKEND_MIMO_BASE_URL:-https://token-plan-sgp.xiaomimimo.com/v1}"
      BACKEND_MIMO_API_KEY: "${BACKEND_MIMO_API_KEY:?BACKEND_MIMO_API_KEY is required}"
      # 3 months of raw samples, swept nightly.
      BACKEND_RETENTION: "${BACKEND_RETENTION:-2160h}"
      # Ping targets. Overridable because the right reference hosts depend on
      # where this is deployed — see the methodology page for what each answers.
      BACKEND_PING_MIMO_HOST: "${BACKEND_PING_MIMO_HOST:-token-plan-sgp.xiaomimimo.com}"
      BACKEND_PING_REF_SGP_HOST: "${BACKEND_PING_REF_SGP_HOST:-sgp1.digitaloceanspaces.com}"
      BACKEND_PING_REF_EU_HOST: "${BACKEND_PING_REF_EU_HOST:-cloudflare.com}"

    healthcheck:
      # The binary probes itself: the runtime is distroless and carries no curl
      # or wget, and adding a shell to the image to run a healthcheck would
      # undo the reason it is distroless.
      #
      # MUST stay the exec form ["CMD", ...]. The string form, and docker run's
      # --health-cmd, are CMD-SHELL: Docker wraps them in /bin/sh, which this
      # image does not have, so the check fails forever while the service is
      # perfectly healthy. Verified both ways.
      test: ["CMD", "/usr/local/bin/mimostats", "-healthcheck"]
      interval: 60s
      timeout: 5s
      start_period: 15s
      start_interval: 5s
      retries: 3

    volumes:
      # SQLite lives here. ~110k rows over the 3-month window, so this stays
      # small — but it is the only state, and losing it loses the history.
      #
      # ./data must EXIST and be owned by the `user:` UID above before the first
      # start. It is gitignored, so a fresh clone does not have it, and Docker
      # creates a missing bind-mount source owned by root — which this non-root
      # container cannot write, so SQLite fails and the container crash-loops.
      # See DEPLOY.md; `mkdir -p data && sudo chown 1000:1000 data`.
      - ./data:/data

    networks:
      - traefik

    deploy:
      resources:
        limits:
          # One probe cycle every 5 minutes against two models. The ceiling is
          # here to bound a runaway, not because the workload needs it.
          cpus: "1.0"
          memory: 512m

    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      # Host rule for this deployment; change if the domain moves.
      traefik.http.routers.mimostats.rule: Host(`mimostats.trick77.com`)
      traefik.http.routers.mimostats.entrypoints: websecure
      traefik.http.routers.mimostats.tls: "true"
      traefik.http.services.mimostats.loadbalancer.server.port: "8080"

networks:
  traefik:
    external: true
