# Production stack: one ismimodown service behind an external Traefik reverse
# proxy that terminates TLS. Requires an external "traefik" network
# (`docker network create traefik`) shared with your Traefik instance.
#
#   cp .env.example .env    # fill in BACKEND_MIMO_API_KEY
#   docker compose up -d
#
services:
  ismimodown:
    image: ghcr.io/trick77/ismimodown:latest
    restart: unless-stopped

    # Non-root, no capabilities, no writable rootfs. The process opens TCP
    # sockets, talks HTTPS and writes one SQLite file — it needs nothing else,
    # so nothing else is granted.
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # SQLite needs a writable TMPDIR for its temp store even in WAL mode, and
      # the rootfs is read-only. Small on purpose: nothing large belongs here.
      - /tmp:size=64m

    environment:
      TMPDIR: /tmp
      BACKEND_ADDR: ":8080"
      BACKEND_LOG_LEVEL: "${BACKEND_LOG_LEVEL:-info}"
      # The token-plan host the tp- key is issued against. Compose reads .env
      # for ${} interpolation only, so anything not listed here never reaches
      # the container.
      BACKEND_MIMO_BASE_URL: "${BACKEND_MIMO_BASE_URL:-https://token-plan-sgp.xiaomimimo.com/v1}"
      BACKEND_MIMO_API_KEY: "${BACKEND_MIMO_API_KEY:?BACKEND_MIMO_API_KEY is required}"

      # The two reference hosts, one per probed region, and the only probe
      # targets that are configurable — see the DefaultRefSGPHost and
      # DefaultRefAMSHost comments in backend/internal/config/config.go. Both of
      # MiMo's own ping targets are both constants and follow nothing here —
      # not even BACKEND_MIMO_BASE_URL above.
      BACKEND_PING_REF_SGP_HOST: "${BACKEND_PING_REF_SGP_HOST:-sgp.proof.ovh.net}"
      BACKEND_PING_REF_AMS_HOST: "${BACKEND_PING_REF_AMS_HOST:-speedtest.amsterdam.linode.com}"

      # Must stay inside the mounted volume below, or the history is written to
      # the read-only rootfs and lost on every restart. Empty fallback rather
      # than a repeated literal: config.Load treats unset and set-but-empty
      # identically and applies its own default, so this file does not restate a
      # value it would then have to be kept in sync with.
      BACKEND_DB_PATH: "${BACKEND_DB_PATH:-}"

      # Probes present as a real coding agent on purpose — a neutral client would
      # not measure what production traffic experiences.
      BACKEND_PROBE_USER_AGENT: "${BACKEND_PROBE_USER_AGENT:-}"

      # That is the whole list. The model pair, the price table, the system
      # prompt, the retention window and the six-layer timeout ladder are
      # constants in config.go rather than settings: they describe what this
      # dashboard measures, and a deployment able to change them could publish a
      # differently-shaped number under the same page.
      #
      # There is deliberately no `env_file:`. It would pass the WHOLE .env,
      # including BACKEND_MIMO_API_KEY, into every future service in this file
      # by accident. Listing each variable keeps that explicit.

    healthcheck:
      # The binary probes itself: the runtime is distroless and carries no curl
      # or wget, and adding a shell to the image to run a healthcheck would
      # undo the reason it is distroless.
      #
      # MUST stay the exec form ["CMD", ...]. The string form, and docker run's
      # --health-cmd, are CMD-SHELL: Docker wraps them in /bin/sh, which this
      # image does not have, so the check fails forever while the service is
      # perfectly healthy. Verified both ways.
      test: ["CMD", "/usr/local/bin/ismimodown", "-healthcheck"]
      interval: 60s
      timeout: 5s
      start_period: 15s
      start_interval: 5s
      retries: 3

    volumes:
      # SQLite lives here. ~110k rows over the 3-month window, so this stays
      # small — but it is the only state, and losing it loses the history.
      #
      # ./data must EXIST and be owned by the `user:` UID above before the first
      # start. It is gitignored, so a fresh clone does not have it, and Docker
      # creates a missing bind-mount source owned by root — which this non-root
      # container cannot write, so SQLite fails and the container crash-loops.
      # See DEPLOY.md; `mkdir -p data && sudo chown 1000:1000 data`.
      - ./data:/data

    networks:
      - traefik

    deploy:
      resources:
        limits:
          # One probe cycle every 5 minutes against two models. The ceiling is
          # here to bound a runaway, not because the workload needs it.
          cpus: "1.0"
          memory: 512m

    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      # Host rule for this deployment; change if the domain moves. The same
      # string is in index.html's og:/twitter: URLs, its canonical link,
      # robots.txt, sitemap.xml and — printed into the pixels — the .host line
      # of assets/og/card.html. Move the host and move all of them, then re-run
      # ui/scripts/gen-og.sh.
      traefik.http.routers.ismimodown.rule: Host(`ismimodown.com`)
      traefik.http.routers.ismimodown.entrypoints: websecure
      # certresolver, not a bare `tls: "true"`. On the old host this router got
      # its certificate from the wildcard Traefik already held for
      # *.trick77.com, so naming a resolver was unnecessary. A separate apex
      # inherits nothing: without this label Traefik serves its own self-signed
      # default certificate and every visitor meets an interstitial. Setting a
      # resolver implies tls, so the boolean is gone rather than sitting beside
      # it.
      #
      # `letsencrypt` is the resolver in the external Traefik's static config,
      # and it is configured with tlsChallenge — TLS-ALPN-01, which is answered
      # on 443 through the websecure entrypoint above. No port 80 is involved
      # and there is no /.well-known/acme-challenge/ route to expose. DNS must
      # resolve BEFORE this deploys, or the ACME order fails against a rate
      # limit that then has to be waited out.
      traefik.http.routers.ismimodown.tls.certresolver: letsencrypt
      traefik.http.services.ismimodown.loadbalancer.server.port: "8080"
      # HSTS is set HERE and not in the Go handler, because only the TLS
      # terminator knows the site is reachable over TLS at all: the container
      # serves plain HTTP, and a Strict-Transport-Security header emitted on an
      # http:// origin is ignored at best and wrong on a dev server. Every other
      # security header (CSP, nosniff, frame-ancestors, Referrer-Policy) comes
      # from the binary instead, so it travels with the app — see
      # httpapi.securityHeaders.
      #
      # No `preload`, though the reason has changed. On trick77.com the answer
      # was that preloading a shared parent domain — irreversible in practice —
      # was not this service's call to make. ismimodown.com is this service's
      # own apex with nothing else under it, so that objection is gone and
      # preloading is now merely a decision nobody has taken. Left off
      # deliberately: it is hard to undo and buys little for a site whose
      # visitors arrive by search rather than by typing the bare host.
      traefik.http.middlewares.ismimodown-hsts.headers.stsSeconds: "31536000"
      traefik.http.middlewares.ismimodown-hsts.headers.stsIncludeSubdomains: "true"
      # Compression belongs to the terminator, not the binary — the app should
      # not be negotiating encodings with a client it never speaks to directly.
      # It was simply never switched on: /api/dashboard is one JSON document
      # carrying a day of cycles per model, which measured ~6x on gzip, and it
      # was going out uncompressed on every load, every five-minute refetch and
      # every cycle event.
      #
      # Traefik does not compress below minResponseBodyBytes (1024 by default),
      # which is the right shape for this: /healthz and an error body stay
      # uncompressed, the dashboard does not.
      traefik.http.middlewares.ismimodown-compress.compress: "true"
      # Order matters: hsts first, so the header is attached whatever the
      # encoding negotiation does.
      traefik.http.routers.ismimodown.middlewares: ismimodown-hsts@docker,ismimodown-compress@docker

      # www exists only to send people to the apex. Someone will type it, and a
      # hostname that resolves to nothing looks like the outage this site is
      # supposed to report on.
      #
      # A SECOND router rather than a second Host() clause on the first: the
      # ACME challenge here is TLS-ALPN-01, which is answered per hostname, so
      # www needs a certificate of its own — and the redirect middleware has to
      # apply to www without applying to the apex it redirects TO.
      #
      # permanent: true, i.e. 301. A 302 tells a search engine the split is
      # temporary and it keeps both hostnames in the index, which is the
      # duplicate content this exists to prevent. The canonical link in
      # index.html says the same thing a second way, for the case where this
      # router is missing entirely.
      traefik.http.routers.ismimodown-www.rule: Host(`www.ismimodown.com`)
      traefik.http.routers.ismimodown-www.entrypoints: websecure
      traefik.http.routers.ismimodown-www.tls.certresolver: letsencrypt
      traefik.http.routers.ismimodown-www.service: ismimodown
      traefik.http.middlewares.ismimodown-www-redirect.redirectregex.regex: ^https://www\.ismimodown\.com/(.*)
      traefik.http.middlewares.ismimodown-www-redirect.redirectregex.replacement: https://ismimodown.com/$${1}
      traefik.http.middlewares.ismimodown-www-redirect.redirectregex.permanent: "true"
      traefik.http.routers.ismimodown-www.middlewares: ismimodown-www-redirect@docker

networks:
  traefik:
    external: true
