# Local stack: the same image, published on localhost with no Traefik and no
# TLS. Useful for checking the built container rather than `make dev`, which
# runs the daemon and Vite from source.
#
#   BACKEND_MIMO_API_KEY=tp-... docker compose -f compose.dev.yaml up --build
services:
  mimostats:
    build:
      context: .
      dockerfile: backend/Containerfile
    restart: unless-stopped
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    environment:
      TMPDIR: /tmp
      BACKEND_ADDR: ":8080"
      BACKEND_LOG_LEVEL: debug
      BACKEND_MIMO_API_KEY: "${BACKEND_MIMO_API_KEY:?BACKEND_MIMO_API_KEY is required}"
      # The same passthrough as the production file, and for a stronger reason:
      # this stack exists to try things against the built container, and the
      # ladder is the most likely thing to want to try. Empty fallbacks, so
      # config.Load stays the only place a default is written — see compose.yaml
      # for why that matters. Anything not listed here never reaches the
      # container, whatever .env says.
      BACKEND_MODELS: "${BACKEND_MODELS:-}"
      BACKEND_DB_PATH: "${BACKEND_DB_PATH:-}"
      BACKEND_MIMO_BASE_URL: "${BACKEND_MIMO_BASE_URL:-}"
      BACKEND_RETENTION: "${BACKEND_RETENTION:-}"
      BACKEND_PING_MIMO_HOST: "${BACKEND_PING_MIMO_HOST:-}"
      BACKEND_PING_REF_SGP_HOST: "${BACKEND_PING_REF_SGP_HOST:-}"
      BACKEND_PROBE_SYSTEM_PROMPT: "${BACKEND_PROBE_SYSTEM_PROMPT:-}"
      BACKEND_PROBE_USER_AGENT: "${BACKEND_PROBE_USER_AGENT:-}"
      BACKEND_PING_TIMEOUT: "${BACKEND_PING_TIMEOUT:-}"
      BACKEND_PROBE_DIAL_TIMEOUT: "${BACKEND_PROBE_DIAL_TIMEOUT:-}"
      BACKEND_PROBE_HEADER_TIMEOUT: "${BACKEND_PROBE_HEADER_TIMEOUT:-}"
      BACKEND_PROBE_TTFT_TIMEOUT: "${BACKEND_PROBE_TTFT_TIMEOUT:-}"
      BACKEND_PROBE_IDLE_TIMEOUT: "${BACKEND_PROBE_IDLE_TIMEOUT:-}"
      BACKEND_PROBE_TIMEOUT: "${BACKEND_PROBE_TIMEOUT:-}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Same trap as the production compose file: this is a BIND mount, so it
      # takes its ownership from the host directory and the image's 1000-owned
      # /data does not apply. ./data is gitignored, so a fresh clone lacks it,
      # and Docker creates a missing bind-mount source as root — which this
      # non-root container cannot write, so SQLite fails with "unable to open
      # database file: permission denied" and the container crash-loops.
      # `mkdir -p data && sudo chown 1000:1000 data` before the first start.
      # Linux only: macOS/OrbStack translates ownership and hides this.
      - ./data:/data
