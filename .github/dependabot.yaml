version: 2
updates:
  # Go backend.
  #
  # No ncruces/go-sqlite3 ignore here, deliberately. peeq pins that driver at
  # v0.23.3 because sqlite-vec's Go bindings are welded to its older API and
  # host-function ABI. mimostats has no sqlite-vec — percentiles are plain SQL
  # over a rolling window — so the pin has no reason to exist and the driver
  # tracks its current release (v0.35.3 at time of writing).
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # React frontend (lands in phase 5).
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Container base image (backend/Containerfile).
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
