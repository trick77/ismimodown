<!--
  ismimodown's icon: lucide's "chart-no-axes-column-increasing" knocked out of a
  solid chip. This is the master — the other two sources here are copies of it,
  and it is the file that ships as /icon.svg as well as rendering the two PWA
  rasters.

  Three rising bars rather than a line chart. Both were rendered at 16px: a
  polyline at this scale paints at about one pixel and reads as a scratch, while
  the bars keep three separate marks. The site's own charts are lines; the icon
  does not have to repeat them to say "measurements".

  THE CHIP IS THE INK, and the mark is cut out of it. The earlier icon was the
  inverse — a stroked lucide "square-play" frame holding stroked bars — and it
  put four thin marks in a 16px square, where the frame spent contrast the bars
  needed. Filled, the silhouette is one solid object at any size, and the same
  object on every ground: Safari composites the tab icon onto a white favourites
  plate, Chrome onto its own dark strip, and a filled chip reads on both without
  either being humoured. That is why there is no longer a separate favicon
  source beside this file — the master IS the tab icon now.

  The bars are PAINTED #1a1a19 (color-bg), not punched through the chip. A real
  knockout would let whatever is behind the icon show between the bars, which on
  a light launcher means a hollow-looking chip; the mark has to stay dark-on-warm
  wherever the icon lands.

  The paths are lucide's (ISC), copied rather than imported — nothing loads a
  glyph library to draw a static asset. The three bars are kept as ONE path, as
  lucide ships the glyph re-joined: split into three, each subpath has a
  zero-width bounding box, which is fatal to any objectBoundingBox gradient it
  might carry. The bars are flat-filled here and would survive it, but the rule
  is one edit away from mattering again — the chip beside them IS gradient-filled
  — so the shape stays joined.

  THE INK IS A GRADIENT, #e08a68 down to #c25f34 at roughly 145°. This is
  music's treatment, and it costs nothing to inherit because ismimodown already
  ships the same palette: #c25f34 IS color-accent-fill in index.css, and
  #e08a68 is color-accent-strong (#d97757) lifted, so the midpoint of the ramp
  is the accent the app is drawn in. It is in objectBoundingBox units, so it
  ramps across the chip's own box rather than across the canvas.

  Sized off the chip's TRUE bbox — x[3,21] y[3,21], 18 square, centred on
  (12,12) — not the nominal 24x24 box the path only partly fills. Scaling by the
  nominal box is what makes a glyph read as a dot at favicon sizes. Note the
  denominator is 18 and not the old 18+stroke: the chip is filled now and its
  drawn edge is its geometric edge.

  TRANSPARENT CANVAS, not a transparent icon: the chip itself is opaque, only
  the four corners outside its rx-4 radius are clear, so it reads as a chip
  rather than as a square. The two consumers that would flatten those corners —
  iOS onto black, Android onto the launcher's own fill — are served by the tiled
  sources beside this file, and gen-icons.sh asserts every ground in both
  directions.

  THE TRANSFORMS ARE DERIVED, not typed:

    outer: scale = 64*C/18,  translate = 32 - 12*scale
    inner: scale = 0.6,      translate = 12*(1 - scale)

  where C is the file's coverage of the canvas: 1.0 here, 0.56 in
  tile-touch.svg, 0.486 in tile-maskable.svg. The inner scale sets the bars'
  16-unit nominal height to 12 drawn units inside an 18-unit chip — a third of
  the chip left as clear ground, evenly split top and bottom. The bars carry
  their own stroke-width 4 rather than inheriting one, because the chip no
  longer has a stroke to inherit; 4 glyph units at scale 0.6 draw as 2.4, the
  weight the mark was tuned at. Change the inner scale OR a coverage and every
  affected number has to be recomputed from these two lines, or the mark
  silently stops filling the coverage its own comment claims.

  C IS 1.0 HERE, not the 0.8975 music and peeq use — this is the one place the
  family is deliberately departed from. Their argument is that a tab already sets
  the icon in padding of its own, so the chip should sit inside that padding
  rather than against it. Rendered at 16px, the extra pixel is worth more than
  the inset. The two TILED sources keep their much smaller coverages — they are
  cropped by the OS and have a different problem to solve.

  Regenerate the rasters with ui/scripts/gen-icons.sh after touching this file —
  and mirror any shape change into the two tiled sources, which are copies and
  cannot follow on their own, and into the inlined copy in assets/og/card.html.
  Then rebuild the UI, so the new bytes land in backend/web/dist, which is what
  the container serves.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <linearGradient id="og" x1="0" y1="0" x2="0.72" y2="1">
    <stop offset="0" stop-color="#e08a68"/>
    <stop offset="1" stop-color="#c25f34"/>
  </linearGradient>
  <g transform="translate(-10.6667 -10.6667) scale(3.55556)">
    <rect x="3" y="3" width="18" height="18" rx="4" fill="url(#og)"/>
    <g transform="translate(4.8 4.8) scale(0.6)" fill="none" stroke="#1a1a19" stroke-width="4" stroke-linecap="round">
      <path d="M6 20v-4M12 20V10M18 20V4"/>
    </g>
  </g>
</svg>
