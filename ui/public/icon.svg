<!--
  The tab icon, served as /icon.svg. This is tile.svg with ONE difference: the
  frame's rect carries a fill.

  That fill is the whole reason this file exists. Safari draws favicons on a
  light plate in its favourites bar and its tab-overflow menu, which turns a bare
  orange outline into a scribble on a white card. Chrome and Firefox draw theirs
  on the tab strip's own dark ground, where the transparent master looked right —
  which is exactly why the problem stayed invisible until someone opened the
  favourites bar.

  The ground is #2e2e2b (color-border), not the app's #1a1a19 color-bg. At
  16px against a dark tab strip a near-black chip disappears into it, and the
  icon has to read as a chip on BOTH surfaces, not just survive the light one.

  Only the frame is filled, not the canvas: the corners stay transparent so the
  icon reads as a rounded chip rather than a square. gen-icons.sh asserts both —
  corner alpha 0 and the frame's ground colour — because losing either is
  invisible in a viewer and only shows up in a real tab.

  Everything else — the gradient ink, the 2 stroke, the derived transforms, the
  true-bbox centring — is tile.svg's, and is documented there. This is a copy and
  cannot follow it on its own: mirror any shape change by hand.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <linearGradient id="og" x1="0" y1="0" x2="0.72" y2="1">
    <stop offset="0" stop-color="#e08a68"/>
    <stop offset="1" stop-color="#c25f34"/>
  </linearGradient>
  <g transform="translate(-6.4000 -6.4000) scale(3.20000)" fill="none" stroke="url(#og)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2" fill="#2e2e2b"/>
    <g transform="translate(5.1733 5.1733) scale(0.56889)">
      <path d="M6 20v-4M12 20V10M18 20V4"/>
    </g>
  </g>
</svg>
