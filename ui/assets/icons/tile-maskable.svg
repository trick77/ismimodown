<!--
  The Android maskable icon (icon-maskable-512.png).

  OPAQUE for the same reason tile-touch.svg is, with a different flattening
  colour behind it: Android fills a maskable icon's alpha with the LAUNCHER's own
  background, which is often light. The ground here is #1a1a19, color-bg.

  The mark pulls in further still — 48.6% coverage — because Android crops this
  one to whatever shape the launcher picks, and only the middle 80% of the square
  is guaranteed to survive. gen-icons.sh asserts the whole mark clears that
  circle rather than trusting this transform to still match its comment; the
  geometry caps coverage at about 62% (the frame's corner sits sqrt(2)*(10-3)+3 =
  12.899 units out from the centre in the 24-space, and 25.6/12.899 = 1.985 is
  the largest outer scale that fits), so 48.6% sits comfortably under it.

  Transform is scale = 64*0.486/(18+2), translate = 32 - 12*scale, per tile.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <linearGradient id="og" x1="0" y1="0" x2="0.72" y2="1">
    <stop offset="0" stop-color="#e08a68"/>
    <stop offset="1" stop-color="#c25f34"/>
  </linearGradient>
  <rect width="64" height="64" fill="#1a1a19"/>
  <g transform="translate(13.3376 13.3376) scale(1.55520)" fill="none" stroke="url(#og)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2"/>
    <g transform="translate(5.1733 5.1733) scale(0.56889)">
      <path d="M6 20v-4M12 20V10M18 20V4"/>
    </g>
  </g>
</svg>
