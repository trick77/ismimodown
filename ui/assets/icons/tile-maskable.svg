<!--
  The Android maskable icon (icon-maskable-512.png).

  OPAQUE for the same reason tile-touch.svg is, with a different flattening
  colour behind it: Android fills a maskable icon's alpha with the LAUNCHER's own
  background, which is often light. The ground here is #1a1a19, color-bg.

  The chip pulls in further still — 48.6% coverage — because Android crops this
  one to whatever shape the launcher picks, and only the middle 80% of the square
  is guaranteed to survive. gen-icons.sh asserts the whole mark clears that
  circle rather than trusting this transform to still match its comment. The
  geometry caps coverage at 65%: the chip's rx-4 corner bulges sqrt(2)*(12-3-4)
  + 4 = 11.071 units out from the centre in the 24-space, and 25.6/11.071 =
  2.312 is the largest outer scale that fits, i.e. 2.312*18/64. 48.6% sits
  comfortably under it.

  Transform is scale = 64*0.486/18, translate = 32 - 12*scale, per tile.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <linearGradient id="og" x1="0" y1="0" x2="0.72" y2="1">
    <stop offset="0" stop-color="#e08a68"/>
    <stop offset="1" stop-color="#c25f34"/>
  </linearGradient>
  <rect width="64" height="64" fill="#1a1a19"/>
  <g transform="translate(11.2640 11.2640) scale(1.72800)">
    <rect x="3" y="3" width="18" height="18" rx="4" fill="url(#og)"/>
    <g transform="translate(4.8 4.8) scale(0.6)" fill="none" stroke="#1a1a19" stroke-width="4" stroke-linecap="round">
      <path d="M6 20v-4M12 20V10M18 20V4"/>
    </g>
  </g>
</svg>
