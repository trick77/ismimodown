<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1a19" />
    <!-- Sources in ui/assets/icons/, rasters regenerated by ui/scripts/gen-icons.sh
         and committed. The tab icon is /icon.svg, the name that matches the
         icon-*.png rasters beside it. There is no favicon.ico and no
         /favicon.svg: backend/web answers those with a 404, and the clients that
         go looking for them are not ones this targets. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>MiMo LLM Stats</title>
    <meta
      name="description"
      content="Latency, throughput, availability and answer correctness for Xiaomi MiMo, measured every five minutes from a single European egress."
    />

    <!-- Link previews for iMessage, WhatsApp, Slack, Telegram and the rest.
         The card is ui/public/og.png, drawn by ui/scripts/gen-og.sh from
         assets/og/card.html and committed.

         The URLs are ABSOLUTE and hardcode the production host. Several
         scrapers — WhatsApp's among them — never resolve a relative og:image
         against the page, and the failure is a preview with no picture rather
         than an error anyone sees. There is no build-time origin to
         substitute: this is a single-host status page, and the Host() rule in
         compose.yaml is the same string. Change both together — and the .host
         line at the bottom of card.html, which prints the same domain INTO the
         picture and only changes when gen-og.sh is re-run.

         The card deliberately carries NO numbers. A preview is scraped once,
         server-side, and then cached by the messenger — Slack for about half an
         hour, WhatsApp and Telegram effectively forever. Any figure baked into
         it would freeze at whatever the scraper saw and keep being shown as
         current. card.html says the same thing at greater length.

         og:title and og:description MIRROR the <title> and description above,
         and the card's own lede mirrors Masthead.tsx. Nothing enforces that —
         reword any of them and reword the rest, then re-run gen-og.sh.

         The ?v= on the image URL is what makes a re-run visible. The same
         caching that argues against baking numbers in also means a messenger
         that has already scraped this page keeps serving the picture it holds
         for /og.png — forever, on WhatsApp and Telegram. The bytes changing
         under a URL they never re-fetch is not an event they see. BUMP THE
         NUMBER whenever gen-og.sh writes a new card, or the redraw reaches
         nobody who has ever shared the link. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="mimostats" />
    <meta property="og:url" content="https://mimostats.trick77.com/" />
    <meta property="og:title" content="MiMo LLM Stats" />
    <meta
      property="og:description"
      content="Latency, throughput, availability and answer correctness for Xiaomi MiMo, measured every five minutes from a single European egress."
    />
    <meta
      property="og:image"
      content="https://mimostats.trick77.com/og.png?v=1"
    />
    <!-- Dimensions let a scraper lay the preview out before the image lands;
         without them Slack and Telegram fall back to a small thumbnail. -->
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="mimostats — latency, throughput, availability and answer correctness for Xiaomi MiMo, measured every five minutes from a single European egress."
    />
    <!-- summary_large_image is what makes X and the clients that copy its tags
         run the card full width instead of cropping it to a square avatar. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MiMo LLM Stats" />
    <meta
      name="twitter:description"
      content="Latency, throughput, availability and answer correctness for Xiaomi MiMo, measured every five minutes from a single European egress."
    />
    <meta
      name="twitter:image"
      content="https://mimostats.trick77.com/og.png?v=1"
    />
    <!-- X does not fall back to og:image:alt, so the alt text is repeated here
         rather than inherited; without it the card is unlabelled for anyone on
         a screen reader. -->
    <meta
      name="twitter:image:alt"
      content="mimostats — latency, throughput, availability and answer correctness for Xiaomi MiMo, measured every five minutes from a single European egress."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
